name: Deploy Mudaala to Cloudflare Workers

on:
  push:
    branches: [main]
    # Test/workflow/documentation-only commits must not redeploy the Worker.
    # If a commit also changes application/configuration code, deployment runs.
    paths-ignore:
      - '.github/workflows/**'
      - 'prisma/migrations/**'
      - 'scripts/test-api.ts'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mudaala-cloudflare-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate schema and generate Prisma client (no database access)
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Build OpenNext Worker without production database credentials
        run: npx @opennextjs/cloudflare build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          CRON_SECRET: build-only-placeholder
          SETTINGS_ENCRYPTION_KEY: build-only-placeholder-key-32chars
          ADMIN_PHONES: "+256700000000"

      - name: Require moderation secret before production deployment
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7d45a3db16c2ce332bf146d34eb01687
        run: |
          set -euo pipefail
          secrets_json="$(npx wrangler secret list --name mudaala-cloudflare --account-id "$CLOUDFLARE_ACCOUNT_ID" --format json)"
          printf '%s' "$secrets_json" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              let secrets;
              try { secrets = JSON.parse(raw); } catch { console.error("Could not parse Worker secret names; refusing production deployment."); process.exit(1); }
              if (!Array.isArray(secrets) || !secrets.some(secret => secret.name === "OPENAI_MODERATION_API_KEY")) {
                console.error("Required OPENAI_MODERATION_API_KEY secret is absent; refusing production deployment.");
                process.exit(1);
              }
              console.log("Required moderation secret is configured (name verified; value was not retrieved).");
            });
          '

      # Capture the active version only after the build succeeds. If deployment
      # or the read-only health check fails, traffic is routed back to this version.
      - name: Capture currently active Worker version
        id: capture_previous
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: 7d45a3db16c2ce332bf146d34eb01687
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/mudaala-cloudflare/deployments" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")"
          previous_version="$(printf '%s' "$response" | jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id')"
          echo "previous_version=$previous_version" >> "$GITHUB_OUTPUT"
          echo "Captured pre-deploy Worker version: $previous_version"

      - name: Deploy to Cloudflare Workers
        id: deploy
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7d45a3db16c2ce332bf146d34eb01687
          command: deploy

      - name: Smoke test live app and database connection (read-only)
        if: ${{ steps.deploy.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          APP_URL: https://mudaala-cloudflare.kaisoisaac.workers.dev
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-connrefused "$APP_URL/api/health")"
          printf '%s' "$body" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const health = JSON.parse(raw);
              console.log(JSON.stringify({
                app: health.app,
                database: health.database,
                ok: health.ok,
                time: health.time
              }));
              if (health.ok !== true || health.app !== "up" || health.database !== "up") {
                process.exit(1);
              }
            });
          '

      - name: Verify live moderation accepts a safe disposable image
        if: ${{ steps.deploy.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          APP_URL: https://mudaala-cloudflare.kaisoisaac.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import { randomInt, randomUUID } from 'node:crypto';
          const base = process.env.APP_URL;
          const password = `mudaala-release-${randomUUID()}-P9!`;
          const phone = `+2567${String(randomInt(10000000, 99999999))}`;
          let registered = false;
          let cookie = '';
          let failure = null;
          try {
            const registration = await fetch(`${base}/api/auth/register`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ phone, name: 'Mudaala Release Smoke', password, country: 'UG', acceptTerms: true }),
            });
            if (registration.status !== 201) throw new Error(`Disposable registration failed: HTTP ${registration.status}`);
            registered = true;
            cookie = registration.headers.get('set-cookie')?.split(';')[0] ?? '';
            if (!cookie) {
              const login = await fetch(`${base}/api/auth/login`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ phone, password }),
              });
              if (!login.ok) throw new Error(`Disposable login failed: HTTP ${login.status}`);
              cookie = login.headers.get('set-cookie')?.split(';')[0] ?? '';
            }
            if (!cookie) throw new Error('No session cookie was issued; cannot safely clean up the disposable account');
            const png = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==', 'base64');
            const form = new FormData();
            form.append('file', new Blob([png], { type: 'image/png' }), 'mudaala-safe-smoke.png');
            const upload = await fetch(`${base}/api/upload`, { method: 'POST', headers: { cookie }, body: form });
            const payload = await upload.json().catch(() => null);
            if (upload.status !== 201 || typeof payload?.url !== 'string') {
              throw new Error(`Safe-image upload/moderation failed: HTTP ${upload.status}`);
            }
            console.log(JSON.stringify({ liveSafeImageModeration: 'pass', uploadStatus: upload.status }));
          } catch (error) {
            failure = error;
          } finally {
            if (registered && cookie) {
              try {
                const cleanup = await fetch(`${base}/api/account`, {
                  method: 'DELETE',
                  headers: { 'content-type': 'application/json', cookie },
                  body: JSON.stringify({ password }),
                });
                const cleanupPayload = await cleanup.json().catch(() => null);
                if (!cleanup.ok || cleanupPayload?.deleted !== true) {
                  failure = new Error(`Disposable account cleanup failed: HTTP ${cleanup.status}`);
                }
              } catch {
                failure = new Error('Disposable account cleanup request failed; manual cleanup is required');
              }
            } else if (registered) {
              failure = new Error('Disposable account was created but no session cookie was available for cleanup');
            }
          }
          if (failure) {
            console.error(failure instanceof Error ? failure.message : String(failure));
            process.exit(1);
          }
          NODE

      - name: Smoke test public Browse and shop-name search
        if: ${{ steps.deploy.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          APP_URL: https://mudaala-cloudflare.kaisoisaac.workers.dev
        run: |
          set -euo pipefail
          listings_body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-connrefused "$APP_URL/api/listings?page=1&pageSize=10")"
          printf '%s' "$listings_body" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              let payload;
              try { payload = JSON.parse(raw); } catch { console.error("Browse returned invalid JSON"); process.exit(1); }
              if (!Array.isArray(payload.items) || typeof payload.total !== "number") {
                console.error("Browse response is missing its expected items/total shape");
                process.exit(1);
              }
              console.log(JSON.stringify({ browse: "ok", items: payload.items.length, total: payload.total }));
            });
          '

          shops_body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-connrefused --get --data-urlencode 'q=gras' "$APP_URL/api/shops/search")"
          printf '%s' "$shops_body" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              let payload;
              try { payload = JSON.parse(raw); } catch { console.error("Shop search returned invalid JSON"); process.exit(1); }
              if (!Array.isArray(payload.shops)) {
                console.error("Shop search response is missing its shops array");
                process.exit(1);
              }
              console.log(JSON.stringify({ shopSearch: "ok", matches: payload.shops.length }));
            });
          '

      - name: Smoke test public shop collections response shape (read-only)
        if: ${{ steps.deploy.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          APP_URL: https://mudaala-cloudflare.kaisoisaac.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.APP_URL;
          const fail = (message) => { console.error(message); process.exit(1); };
          const shopsResponse = await fetch(`${base}/api/shops/search?q=gras`);
          if (!shopsResponse.ok) fail(`Shop search failed before collections smoke: HTTP ${shopsResponse.status}`);
          const shopsPayload = await shopsResponse.json().catch(() => null);
          if (!Array.isArray(shopsPayload?.shops) || !shopsPayload.shops.some((shop) => typeof shop.id === 'string' && shop.id.length > 0)) {
            fail('Shop search returned no usable public shop ID for the collections smoke');
          }
          const shop = shopsPayload.shops.find((candidate) => typeof candidate.id === 'string' && candidate.id.length > 0);
          const response = await fetch(`${base}/api/shops/${encodeURIComponent(shop.id)}/collections`);
          if (!response.ok) fail(`Public shop collections endpoint failed: HTTP ${response.status}`);
          const payload = await response.json().catch(() => null);
          if (!Array.isArray(payload?.collections)) fail('Public shop collections response is missing collections[]');
          for (const collection of payload.collections) {
            if (typeof collection.id !== 'string' || typeof collection.title !== 'string' ||
                !Number.isInteger(collection.itemCount) || collection.itemCount < 0) {
              fail('Public collection response contains an invalid card shape');
            }
            if ('userId' in collection || 'phone' in collection || 'contact' in collection) {
              fail('Public collection response exposes a private ownership/contact field');
            }
          }
          let detailChecked = false;
          if (payload.collections.length > 0) {
            const detailResponse = await fetch(`${base}/api/collections/${encodeURIComponent(payload.collections[0].id)}`);
            if (!detailResponse.ok) fail(`Public collection detail failed: HTTP ${detailResponse.status}`);
            const detail = await detailResponse.json().catch(() => null);
            if (detail?.collection?.id !== payload.collections[0].id || !Array.isArray(detail.items)) {
              fail('Public collection detail response is missing collection/items shape');
            }
            detailChecked = true;
          }
          console.log(JSON.stringify({ publicShopCollections: 'ok', cards: payload.collections.length, detailChecked }));
          NODE

      - name: Verify shared rate-limit binding is reachable (no customer-data writes)
        if: ${{ steps.deploy.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          APP_URL: https://mudaala-cloudflare.kaisoisaac.workers.dev
        run: |
          set -euo pipefail
          # A deliberately invalid phone format yields no phone candidates, so
          # this writes only a short-lived IP limiter event: no account lookup,
          # customer-data write, or SMS. 401 means the limiter allowed it; 429 means
          # it enforced an existing budget. 503 means the shared binding is down.
          status="$(curl --silent --show-error --max-time 20 --dump-header /tmp/rate-limit-smoke.headers --output /tmp/rate-limit-smoke.json --write-out '%{http_code}' \
            --request POST "$APP_URL/api/auth/login" \
            --header 'content-type: application/json' \
            --data '{"phone":"x","password":"not-a-password"}')"
          echo "Shared limiter smoke HTTP status: $status"
          if [ "$status" != "401" ] && [ "$status" != "429" ]; then
            cat /tmp/rate-limit-smoke.json
            echo "Expected 401 or 429 from invalid phone login; 503/other status means shared limiter smoke failed."
            exit 1
          fi
          bearer_mode="$(awk 'tolower($1) == "x-mudaala-bearer-auth:" { gsub(/\r/, "", $2); print tolower($2) }' /tmp/rate-limit-smoke.headers | tail -n 1)"
          echo "Production Bearer compatibility mode: ${bearer_mode:-missing}"
          if [ "$bearer_mode" != "disabled" ]; then
            echo "Production must remain cookie-only; missing or enabled Bearer mode is a deployment failure."
            exit 1
          fi

      - name: Roll back to the previous Worker version if deployment or health smoke fails
        id: rollback
        if: ${{ failure() && steps.capture_previous.outputs.previous_version != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: 7d45a3db16c2ce332bf146d34eb01687
          PREVIOUS_VERSION: ${{ steps.capture_previous.outputs.previous_version }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg version "$PREVIOUS_VERSION" '{strategy:"percentage",versions:[{version_id:$version,percentage:100}],annotations:{"workers/message":"Automatic rollback after failed deployment or health smoke check"}}')"
          response="$(curl --fail --silent --show-error --request POST \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/mudaala-cloudflare/deployments" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          printf '%s' "$response" | jq -c '{success,errors,result}'

      - name: Verify rollback health (read-only)
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        env:
          APP_URL: https://mudaala-cloudflare.kaisoisaac.workers.dev
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-connrefused "$APP_URL/api/health")"
          printf '%s' "$body" | node -e '
            let raw = "";
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              const health = JSON.parse(raw);
              console.log(JSON.stringify({
                app: health.app,
                database: health.database,
                ok: health.ok,
                time: health.time
              }));
              if (health.ok !== true || health.app !== "up" || health.database !== "up") {
                process.exit(1);
              }
            });
          '
