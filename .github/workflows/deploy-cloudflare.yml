name: Deploy Mudaala to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mudaala-cloudflare-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate schema and generate Prisma client (no database access)
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Build OpenNext Worker without production database credentials
        run: npx @opennextjs/cloudflare build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          CRON_SECRET: build-only-placeholder
          SETTINGS_ENCRYPTION_KEY: build-only-placeholder-key-32chars
          ADMIN_PHONES: "+256700000000"

      # Pull requests are build-only. Production deploys occur only after a
      # successful build on main, or an explicitly requested dispatch on main.
      - name: Deploy to Cloudflare Workers
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7d45a3db16c2ce332bf146d34eb01687
          command: deploy
