name: Pin and verify Cloudflare dependencies

on:
  push:
    branches: [fix/pinned-cloudflare-dependencies]

permissions:
  contents: write

jobs:
  lock-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Update the lockfile while preserving the known-good Next.js 16.3.8.
      # Do not run npm install without a lockfile in production build workflows.
      - name: Add exact deployment dependencies and update lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact @aws-sdk/client-s3@latest @prisma/adapter-pg@6.19.3 pg@8.16.3 next@16.3.8
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact @opennextjs/cloudflare@1.20.8 eslint-config-next@16.3.8
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.dependencies.next!=='16.3.8'||l.packages['node_modules/next'].version!=='16.3.8') throw new Error('Next.js must remain pinned at 16.3.8'); console.log(JSON.stringify({next:p.dependencies.next,lockedNext:l.packages['node_modules/next'].version,openNext:p.devDependencies['@opennextjs/cloudflare'],adapter:p.dependencies['@prisma/adapter-pg'],pg:p.dependencies.pg,aws:p.dependencies['@aws-sdk/client-s3']}))"

      - name: Commit generated lockfile to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Pin OpenNext and Prisma adapter dependencies"
            git push origin HEAD
          fi

      - name: Install exact locked dependencies
        run: npm ci

      - name: Validate schema and generate Prisma client
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Type-check project
        run: npx tsc --noEmit

      - name: Build OpenNext Worker without production credentials or migrations
        run: npx @opennextjs/cloudflare build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          CRON_SECRET: build-only-placeholder
          SETTINGS_ENCRYPTION_KEY: build-only-placeholder-key-32chars
          ADMIN_PHONES: "+256700000000"

      - name: Lint changed application files
        run: npx eslint next.config.ts src/app/api/upload/route.ts src/lib/storage.ts src/components/commerce/auth-dialog.tsx
