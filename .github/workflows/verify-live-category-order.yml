name: Verify live category filter and mobile controls

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Mudaala to Cloudflare Workers"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify-category-filter:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install Playwright Chromium
        run: |
          npm install --prefix /tmp/mudaala-category-check playwright@1.56.1
          /tmp/mudaala-category-check/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify production category filter options and mobile controls
        env:
          APP_URL: https://mudaala.store
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/mudaala-category-check/node_modules/playwright');
          const base = process.env.APP_URL.replace(/\/$/, '');
          const expected = [
            'All categories',
            'Clothes & Apparel',
            'Phones & Electronics',
            'Beauty & Personal Care',
            'Food & Groceries',
            'Services',
            'Home & Kitchen',
            'Household Essentials',
            'Hardware & Building',
            'Farm Produce',
            'Home Décor & Furniture',
            'Transport & Haulage',
            'Livestock & Feed',
            'Arts & Crafts',
            'Scrap & Recyclables',
            'Other',
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              hasTouch: true,
            });
            const page = await context.newPage();
            try {
              // Verify the category control in the restored pre-PR-242 Browse UI.
              // This is a filter dialog, not the category rail introduced by #242.
              await page.goto(base + '/#/browse', { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.getByRole('button', { name: 'Open filters', exact: true }).click();
              const dialog = page.getByRole('dialog', { name: 'Filters' });
              await dialog.waitFor({ state: 'visible', timeout: 10000 });
              await dialog.locator('#f-category').click();
              const listbox = page.getByRole('listbox');
              await listbox.waitFor({ state: 'visible', timeout: 10000 });
              const actual = await listbox.getByRole('option').allTextContents();
              const normalized = actual.map((label) => label.trim().replace(/\\s+/g, ' '));
              if (JSON.stringify(normalized) !== JSON.stringify(expected)) {
                throw new Error('Production category filter options mismatch: expected ' + JSON.stringify(expected) + ', received ' + JSON.stringify(normalized));
              }
              await page.keyboard.press('Escape');
              await page.keyboard.press('Escape');
              await dialog.waitFor({ state: 'hidden', timeout: 10000 });

              const viewport = await page.evaluate(() => ({
                width: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
              }));
              if (viewport.scrollWidth > viewport.width + 1) {
                throw new Error('Category filter check found page-level horizontal overflow on 390px viewport: ' + JSON.stringify(viewport));
              }

              // The persistent feedback action must remain clear of the fixed
              // mobile navigation. Opening and closing the form is read-only.
              const feedbackButton = page.getByRole('button', { name: 'Report a bug', exact: true });
              await feedbackButton.waitFor({ state: 'visible', timeout: 10000 });
              const feedbackBox = await feedbackButton.boundingBox();
              const navBox = await page.getByRole('navigation', { name: 'Primary' }).boundingBox();
              if (!feedbackBox || !navBox || feedbackBox.y + feedbackBox.height > navBox.y) {
                throw new Error('Mobile feedback button overlaps the primary bottom navigation');
              }
              const installButton = page.getByRole('button', { name: /Get app|Get the app|Install Mudaala/ });
              if (await installButton.isVisible().catch(() => false)) {
                const installBox = await installButton.boundingBox();
                if (!installBox) throw new Error('Install prompt has no measurable button bounds');
                const overlapsInstall = feedbackBox.x < installBox.x + installBox.width &&
                  feedbackBox.x + feedbackBox.width > installBox.x &&
                  feedbackBox.y < installBox.y + installBox.height &&
                  feedbackBox.y + feedbackBox.height > installBox.y;
                if (overlapsInstall) {
                  throw new Error('Mobile feedback button overlaps the PWA install action');
                }
              }
              // Also verify the floating controls at a narrow 320px phone width.
              // This catches cropped prompts and overlaps that a 390px check misses.
              await page.setViewportSize({ width: 320, height: 740 });
              await page.waitForTimeout(100);
              const narrowViewport = await page.evaluate(() => ({
                width: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
              }));
              if (narrowViewport.scrollWidth > narrowViewport.width + 1) {
                throw new Error('Narrow 320px viewport has horizontal overflow: ' + JSON.stringify(narrowViewport));
              }
              const narrowFeedback = await feedbackButton.boundingBox();
              const narrowNav = await page.getByRole('navigation', { name: 'Primary' }).boundingBox();
              const narrowInstall = await page.getByRole('button', { name: /Get app|Get the app|Install Mudaala/ }).boundingBox().catch(() => null);
              if (!narrowFeedback || !narrowNav ||
                  narrowFeedback.x < 0 || narrowFeedback.x + narrowFeedback.width > 320 ||
                  narrowFeedback.y < 0 || narrowFeedback.y + narrowFeedback.height > narrowNav.y) {
                throw new Error('Feedback action is cropped or overlaps mobile navigation at 320px');
              }
              if (narrowInstall && (narrowInstall.x < 0 || narrowInstall.x + narrowInstall.width > 320 ||
                  narrowInstall.y < 0 || narrowInstall.y + narrowInstall.height > 740)) {
                throw new Error('Install action is cropped at 320px: ' + JSON.stringify(narrowInstall));
              }
              if (narrowInstall && narrowFeedback.x < narrowInstall.x + narrowInstall.width &&
                  narrowFeedback.x + narrowFeedback.width > narrowInstall.x &&
                  narrowFeedback.y < narrowInstall.y + narrowInstall.height &&
                  narrowFeedback.y + narrowFeedback.height > narrowInstall.y) {
                throw new Error('Feedback and install actions overlap at 320px');
              }
              await page.setViewportSize({ width: 390, height: 844 });
              await feedbackButton.click();
              await page.getByRole('dialog', { name: 'Help us improve Mudaala' }).waitFor({ state: 'visible', timeout: 10000 });
              await page.getByRole('button', { name: 'Close feedback form' }).click();

              console.log(JSON.stringify({
                productionCategoryFilterOptions: 'pass',
                viewport390pxNoPageOverflow: 'pass',
                feedbackButtonVisible: 'pass',
                feedbackButtonClearOfBottomNavigation: 'pass',
                feedbackFormOpenClose: 'pass',
                categoryOptions: normalized,
                totalCategoryOptions: normalized.length,
              }, null, 2));
            } finally {
              await context.close();
              await browser.close();
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack || error.message : String(error));
            process.exit(1);
          });
          NODE
