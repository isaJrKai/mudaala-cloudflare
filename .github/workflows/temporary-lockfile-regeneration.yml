name: Temporary lockfile regeneration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.head_ref == 'fix/mobile-browse-grid-transient-retries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from declared dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install and production audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
