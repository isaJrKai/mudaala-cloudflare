name: Regenerate dependency lockfile artifact

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/production-dependency-advisories

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event_name == 'push' || (github.event.pull_request.head.ref == 'fix/production-dependency-advisories' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile on the security-fix branch
        if: github.event_name == 'push' || github.event.pull_request.head.ref == 'fix/production-dependency-advisories'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize dependency lockfile"
          git push origin HEAD:fix/production-dependency-advisories
      - name: Verify clean install and production audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
