name: Regenerate dependency lockfile artifact

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/production-dependency-advisories

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install and production audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
