name: Validate Mudaala pull requests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mudaala
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mudaala"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit unused files, exports, and dependencies (Knip)
        run: npx --yes knip@5 --reporter compact
        continue-on-error: true # Audit findings are triaged before removal; don't hide build/security test results.

      - name: Validate Prisma schema and generate client
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Build Cloudflare Worker bundle without production credentials
        run: npx @opennextjs/cloudflare build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          CRON_SECRET: build-only-placeholder
          SETTINGS_ENCRYPTION_KEY: build-only-placeholder-key-32chars
          ADMIN_PHONES: "+256700000000"

      # All behavioural/security tests below use this disposable CI database.
      # Nothing in this job connects to or mutates the production Supabase DB.
      - name: Create schema in disposable PostgreSQL
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Apply and verify direct Data API deny policies in disposable PostgreSQL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261014110000_deny_direct_data_api_access/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $
          DECLARE
            tbl text;
            policy_count integer;
          BEGIN
            SELECT count(*) INTO policy_count
            FROM pg_policies
            WHERE schemaname = 'public'
              AND policyname = 'deny_direct_api_clients'
              AND 'anon' = ANY(roles)
              AND 'authenticated' = ANY(roles)
              AND qual = 'false'
              AND with_check = 'false';
            IF policy_count <> 12 THEN
              RAISE EXCEPTION 'Expected 12 deny-all Data API policies, found %', policy_count;
            END IF;

            FOREACH tbl IN ARRAY ARRAY[
              'AppSetting', 'AuditLog', 'BusinessProfile', 'Listing',
              'Notification', 'PasswordReset', 'PriceSnapshot', 'Report',
              'SavedSearch', 'Session', 'ShopFollow', 'User'
            ]
            LOOP
              IF has_table_privilege('anon', format('public.%I', tbl), 'SELECT')
                 OR has_table_privilege('anon', format('public.%I', tbl), 'INSERT')
                 OR has_table_privilege('anon', format('public.%I', tbl), 'UPDATE')
                 OR has_table_privilege('anon', format('public.%I', tbl), 'DELETE')
                 OR has_table_privilege('authenticated', format('public.%I', tbl), 'SELECT')
                 OR has_table_privilege('authenticated', format('public.%I', tbl), 'INSERT')
                 OR has_table_privilege('authenticated', format('public.%I', tbl), 'UPDATE')
                 OR has_table_privilege('authenticated', format('public.%I', tbl), 'DELETE')
              THEN
                RAISE EXCEPTION 'Unexpected direct Data API table grant on %', tbl;
              END IF;
            END LOOP;
          END
          $;
          SQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Seed development fixtures into disposable PostgreSQL
        run: npx tsx scripts/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Start local app for API tests
        run: |
          npm run dev > /tmp/mudaala-dev.log 2>&1 &
          echo $! > /tmp/mudaala-dev.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/mudaala-health.json; then
              cat /tmp/mudaala-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mudaala-dev.log
          exit 1
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          CRON_SECRET: ci-only-cron-secret
          SETTINGS_ENCRYPTION_KEY: ci-only-settings-encryption-key-32chars
          ADMIN_PHONES: "+256712000001"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          APP_ORIGIN: http://localhost:3000
          ALLOW_BEARER_AUTH: "1"
          CSRF_TRUSTED_HOSTS: preview-sandbox.preview-platform.example

      - name: Run API behavior, account-isolation, moderation, and photo tests
        run: npx tsx scripts/test-api.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          CRON_SECRET: ci-only-cron-secret
          SETTINGS_ENCRYPTION_KEY: ci-only-settings-encryption-key-32chars
          ADMIN_PHONES: "+256712000001"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          APP_ORIGIN: http://localhost:3000
          ALLOW_BEARER_AUTH: "1"
          CSRF_TRUSTED_HOSTS: preview-sandbox.preview-platform.example
