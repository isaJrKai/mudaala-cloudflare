name: Validate Mudaala pull requests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mudaala
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mudaala"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit unused files, exports, and dependencies (Knip)
        run: npx --yes knip@5 --reporter compact
        continue-on-error: true # Audit findings are triaged before removal; don't hide build/security test results.

      - name: Validate Prisma schema and generate client
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Build Cloudflare Worker bundle without production credentials
        run: npx @opennextjs/cloudflare build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          CRON_SECRET: build-only-placeholder
          SETTINGS_ENCRYPTION_KEY: build-only-placeholder-key-32chars
          ADMIN_PHONES: "+256700000000"

      - name: Start isolated Durable Object rate-limit prototype
        run: |
          npx wrangler dev --config wrangler.rate-limit-prototype.jsonc --local --port 8787 > /tmp/mudaala-rate-limit-prototype.log 2>&1 &
          echo $! > /tmp/mudaala-rate-limit-prototype.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              echo "Rate-limit prototype Worker is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mudaala-rate-limit-prototype.log
          exit 1

      - name: Test Durable Object rate-limit atomicity, expiry, isolation, and clearing
        run: npx tsx scripts/test-rate-limit-prototype.ts

      # All behavioural/security tests below use this disposable CI database.
      # Nothing in this job connects to or mutates the production Supabase DB.
      - name: Create schema in disposable PostgreSQL
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Apply and verify direct Data API deny policies in disposable PostgreSQL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261014110000_deny_direct_data_api_access/migration.sql
          policy_count=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_policies WHERE schemaname='public' AND policyname='deny_direct_api_clients' AND 'anon'=ANY(roles) AND 'authenticated'=ANY(roles) AND qual='false' AND with_check='false'")
          if [ "$policy_count" != "12" ]; then
            echo "Expected 12 deny-all Data API policies, found $policy_count"
            exit 1
          fi
          grant_count=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.role_table_grants WHERE table_schema='public' AND table_name IN ('AppSetting','AuditLog','BusinessProfile','Listing','Notification','PasswordReset','PriceSnapshot','Report','SavedSearch','Session','ShopFollow','User') AND grantee IN ('anon','authenticated') AND privilege_type IN ('SELECT','INSERT','UPDATE','DELETE')")
          if [ "$grant_count" != "0" ]; then
            echo "Expected no direct Data API table grants, found $grant_count"
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Seed development fixtures into disposable PostgreSQL
        run: npx tsx scripts/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Start local app for API tests
        run: |
          npm run dev > /tmp/mudaala-dev.log 2>&1 &
          echo $! > /tmp/mudaala-dev.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/mudaala-health.json; then
              cat /tmp/mudaala-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mudaala-dev.log
          exit 1
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          CRON_SECRET: ci-only-cron-secret
          SETTINGS_ENCRYPTION_KEY: ci-only-settings-encryption-key-32chars
          ADMIN_PHONES: "+256712000001"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          APP_ORIGIN: http://localhost:3000
          ALLOW_BEARER_AUTH: "1"
          CSRF_TRUSTED_HOSTS: preview-sandbox.preview-platform.example

      - name: Run API behavior, account-isolation, moderation, and photo tests
        run: npx tsx scripts/test-api.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          CRON_SECRET: ci-only-cron-secret
          SETTINGS_ENCRYPTION_KEY: ci-only-settings-encryption-key-32chars
          ADMIN_PHONES: "+256712000001"
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          APP_ORIGIN: http://localhost:3000
          ALLOW_BEARER_AUTH: "1"
          CSRF_TRUSTED_HOSTS: preview-sandbox.preview-platform.example
