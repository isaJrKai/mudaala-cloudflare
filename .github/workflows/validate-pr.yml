name: Validate Mudaala pull requests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mudaala
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mudaala"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Bun for content-policy tests
        uses: oven-sh/setup-bun@v2

      - name: Test marketplace content policy
        run: npm run test:content-policy

      - name: Test merchant Growth Coach recommendation rules
        run: npm run test:merchant-growth

      - name: Test shared commerce recommendation engine
        run: npm run test:recommendations

      - name: Test Web Push VAPID and encryption
        run: npm run test:web-push

      - name: Test public listing continues when expiry sweep fails
        run: npm run test:public-listing-expiry

      - name: Run ESLint across the repository
        run: npm run lint

      - name: Audit unused files, exports, and dependencies (Knip)
        run: npx --yes knip@5 --reporter compact
        continue-on-error: true # Audit findings are triaged before removal; don't hide build/security test results.

      - name: Validate Prisma schema and generate client
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Build Cloudflare Worker bundle without production credentials
        run: npx @opennextjs/cloudflare build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          CRON_SECRET: build-only-placeholder
          SETTINGS_ENCRYPTION_KEY: build-only-placeholder-key-32chars
          ADMIN_PHONES: "+256700000000"

      - name: Scan client bundle for high-confidence secret patterns
        run: node scripts/check-client-bundle-secrets.mjs

      - name: Verify photo storage configuration fails closed in production
        run: npx tsx scripts/test-photo-storage-config.ts

      - name: Test fair featured-shop rotation policy
        run: npx tsx scripts/test-featured-shop-rotation.ts

      - name: Start isolated Durable Object rate-limit prototype
        run: |
          npx wrangler dev --config wrangler.rate-limit-prototype.jsonc --local --port 8787 > /tmp/mudaala-rate-limit-prototype.log 2>&1 &
          echo $! > /tmp/mudaala-rate-limit-prototype.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              echo "Rate-limit prototype Worker is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mudaala-rate-limit-prototype.log
          exit 1

      - name: Test Durable Object rate-limit atomicity, expiry, isolation, and clearing
        run: npx tsx scripts/test-rate-limit-prototype.ts

      # All behavioural/security tests below use this disposable CI database.
      # Nothing in this job connects to or mutates the production Supabase DB.
      - name: Create schema in disposable PostgreSQL
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Apply and verify direct Data API deny policies in disposable PostgreSQL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $body$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'mudaala_runtime') THEN
              CREATE ROLE mudaala_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
          END
          $body$;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261014110000_deny_direct_data_api_access/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE POLICY category_interest_deny_direct_api_clients ON public."CategoryInterest" FOR ALL TO anon, authenticated USING (false) WITH CHECK (false);'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP TABLE IF EXISTS public."StockMovement", public."SaleItem", public."Sale", public."BusinessProduct", public."ListingDailyAnalytics", public."ShopDailyAnalytics" CASCADE;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261020000000_business_records_foundation/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261020190000_listing_daily_analytics/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261020200000_business_records_rls/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP TABLE IF EXISTS public."ProductCollectionItem", public."ProductCollection", public."ShowroomItem" CASCADE;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261021113000_product_collections/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261021150000_collection_scheduling/migration.sql
          collection_rls_count=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('ProductCollection','ProductCollectionItem') AND c.relrowsecurity")
          collection_policy_count=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename IN ('ProductCollection','ProductCollectionItem') AND policyname IN ('deny_direct_api_clients','mudaala_runtime_access')")
          collection_runtime_grants=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.role_table_grants WHERE table_schema='public' AND table_name IN ('ProductCollection','ProductCollectionItem') AND grantee='mudaala_runtime' AND privilege_type IN ('SELECT','INSERT','UPDATE','DELETE')")
          if [ "$collection_rls_count" != "2" ] || [ "$collection_policy_count" != "4" ] || [ "$collection_runtime_grants" != "8" ]; then
            echo "Collection migration security checks failed: RLS=$collection_rls_count policies=$collection_policy_count runtime_grants=$collection_runtime_grants"
            exit 1
          fi
          echo "Product collection PostgreSQL migration passed: both tables have RLS, deny/runtime policies and least-privilege DML grants."
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20261027080000_shop_showroom_items/migration.sql
          showroom_rls=$(psql "$DATABASE_URL" -Atc "SELECT c.relrowsecurity::int FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname='ShowroomItem'")
          showroom_policy_count=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_policies WHERE schemaname='public' AND tablename='ShowroomItem' AND policyname IN ('deny_direct_api_clients','mudaala_runtime_access')")
          showroom_grants=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.role_table_grants WHERE table_schema='public' AND table_name='ShowroomItem' AND grantee='mudaala_runtime' AND privilege_type IN ('SELECT','INSERT','UPDATE','DELETE')")
          if [ "$showroom_rls" != "1" ] || [ "$showroom_policy_count" != "2" ] || [ "$showroom_grants" != "4" ]; then
            echo "Showroom migration security checks failed: RLS=$showroom_rls policies=$showroom_policy_count runtime_grants=$showroom_grants"
            exit 1
          fi
          echo "Showroom PostgreSQL migration passed: RLS, deny/runtime policies and least-privilege grants verified."
          policy_count=$(psql "$DATABASE_URL" -Atc "SELECT count(DISTINCT tablename) FROM pg_policies WHERE schemaname='public' AND tablename IN ('AppSetting','AuditLog','BusinessProfile','BusinessProduct','CategoryInterest','Listing','ListingDailyAnalytics','Notification','PasswordReset','PriceSnapshot','Report','Sale','SaleItem','SavedSearch','Session','ShopDailyAnalytics','ShopFollow','ShowroomItem','StockMovement','User') AND 'anon'=ANY(roles) AND 'authenticated'=ANY(roles) AND qual='false' AND with_check='false'")
          if [ "$policy_count" != "20" ]; then
            echo "Expected deny-all Data API policies on all 20 application tables, found $policy_count tables"
            exit 1
          fi
          grant_count=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.role_table_grants WHERE table_schema='public' AND table_name IN ('AppSetting','AuditLog','BusinessProfile','BusinessProduct','CategoryInterest','Listing','ListingDailyAnalytics','Notification','PasswordReset','PriceSnapshot','Report','Sale','SaleItem','SavedSearch','Session','ShopDailyAnalytics','ShopFollow','ShowroomItem','StockMovement','User') AND grantee IN ('anon','authenticated') AND privilege_type IN ('SELECT','INSERT','UPDATE','DELETE')")
          if [ "$grant_count" != "0" ]; then
            echo "Expected no direct Data API table grants, found $grant_count"
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Validate SQLite product collection migration and constraints
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          connection = sqlite3.connect(":memory:")
          connection.execute("PRAGMA foreign_keys = ON")
          connection.execute('CREATE TABLE "User" ("id" TEXT NOT NULL PRIMARY KEY)')
          connection.execute('CREATE TABLE "Listing" ("id" TEXT NOT NULL PRIMARY KEY)')
          migration = Path("prisma/migrations-sqlite/20261021113000_product_collections/migration.sql").read_text()
          connection.executescript(migration)
          schedule_migration = Path("prisma/migrations-sqlite/20261021150000_collection_scheduling/migration.sql").read_text()
          connection.executescript(schedule_migration)
          schedule_columns = {row[1] for row in connection.execute('PRAGMA table_info("ProductCollection")')}
          if not {"startsAt", "endsAt"}.issubset(schedule_columns):
              raise SystemExit("Expected optional collection schedule columns to be present")
          connection.execute('INSERT INTO "User" ("id") VALUES (?)', ("owner-1",))
          connection.execute('INSERT INTO "Listing" ("id") VALUES (?)', ("listing-1",))
          connection.execute('INSERT INTO "ProductCollection" ("id","userId","title","updatedAt") VALUES (?,?,?,CURRENT_TIMESTAMP)', ("collection-1","owner-1","Seasonal picks"))
          connection.execute('INSERT INTO "ProductCollectionItem" ("id","collectionId","listingId") VALUES (?,?,?)', ("item-1","collection-1","listing-1"))
          for sql, params in [
              ('INSERT INTO "ProductCollectionItem" ("id","collectionId","listingId") VALUES (?,?,?)', ("item-2","collection-1","listing-1")),
              ('INSERT INTO "ProductCollection" ("id","userId","title","updatedAt") VALUES (?,?,?,CURRENT_TIMESTAMP)', ("bad-title","owner-1","")),
              ('INSERT INTO "ProductCollectionItem" ("id","collectionId","listingId") VALUES (?,?,?)', ("bad-fk","missing","listing-1")),
          ]:
              try:
                  connection.execute(sql, params)
              except sqlite3.IntegrityError:
                  continue
              raise SystemExit(f"Expected SQLite integrity constraint to reject: {sql}")
          indexes = {row[1] for row in connection.execute('PRAGMA index_list("ProductCollectionItem")')}
          if not indexes:
              raise SystemExit("Expected collection-item indexes to be created")
          print("SQLite collection migrations passed: schema, schedule columns, indexes, foreign keys, title and duplicate-item constraints.")
          PY

      - name: Validate SQLite showroom migration and constraints
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          connection = sqlite3.connect(":memory:")
          connection.execute("PRAGMA foreign_keys = ON")
          connection.execute('CREATE TABLE "User" ("id" TEXT NOT NULL PRIMARY KEY)')
          migration = Path("prisma/migrations-sqlite/20261027080000_shop_showroom_items/migration.sql").read_text()
          connection.executescript(migration)
          connection.execute('INSERT INTO "User" ("id") VALUES (?)', ("owner-1",))
          connection.execute('INSERT INTO "ShowroomItem" ("id","userId","title","description","category","availability","updatedAt") VALUES (?,?,?,?,?,?,CURRENT_TIMESTAMP)', ("show-1","owner-1","Three-seater sofa","A sofa that can be sourced in different fabrics.","home-decor","AVAILABLE_ON_ORDER"))
          for sql, params in [
              ('INSERT INTO "ShowroomItem" ("id","userId","title","description","category","updatedAt") VALUES (?,?,?,?,?,CURRENT_TIMESTAMP)', ("bad-title","owner-1","x","This description is long enough to pass.","home-decor")),
              ('INSERT INTO "ShowroomItem" ("id","userId","title","description","category","availability","updatedAt") VALUES (?,?,?,?,?,?,CURRENT_TIMESTAMP)', ("bad-status","owner-1","Three-seater sofa","A sofa that can be sourced in different fabrics.","home-decor","UNKNOWN")),
              ('INSERT INTO "ShowroomItem" ("id","userId","title","description","category","updatedAt") VALUES (?,?,?,?,?,CURRENT_TIMESTAMP)', ("bad-owner","missing","Three-seater sofa","A sofa that can be sourced in different fabrics.","home-decor")),
          ]:
              try:
                  connection.execute(sql, params)
              except sqlite3.IntegrityError:
                  continue
              raise SystemExit(f"Expected SQLite showroom constraint to reject: {sql}")
          indexes = {row[1] for row in connection.execute('PRAGMA index_list("ShowroomItem")')}
          if len(indexes) < 2:
              raise SystemExit("Expected showroom owner/availability indexes")
          print("SQLite showroom migration passed: owner foreign key, title/description, availability and indexes.")
          PY

      - name: Seed development fixtures into disposable PostgreSQL
        run: npx tsx scripts/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Test service listing stock-field normalization for publish and edit
        run: npx tsx scripts/test-service-listing-form.ts

      - name: Verify logical backup and restore in disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          backup_file="$(mktemp /tmp/mudaala-ci-backup.XXXXXX.dump)"
          trap 'rm -f "$backup_file"' EXIT
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file="$backup_file"
          createdb -h 127.0.0.1 -U postgres mudaala_restore
          pg_restore --no-owner --no-privileges --dbname=postgresql://postgres:postgres@127.0.0.1:5432/mudaala_restore "$backup_file"
          restored_tables=$(psql postgresql://postgres:postgres@127.0.0.1:5432/mudaala_restore -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'")
          if [ "$restored_tables" -lt 20 ]; then
            echo "Expected at least 20 restored tables, found $restored_tables"
            exit 1
          fi
          echo "Disposable PostgreSQL backup and restore passed."
