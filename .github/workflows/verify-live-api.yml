name: Verify live API, privacy boundaries, and photos

on:
  workflow_dispatch:
  # Workflow-only verifier changes can run against production without redeploying the Worker.
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-api.yml'
  workflow_run:
    workflows: ["Deploy Mudaala to Cloudflare Workers"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify public APIs, authorization boundaries, and image delivery
        env:
          APP_URL: https://mudaala-cloudflare.kaisoisaac.workers.dev
          EXPECTED_ADMIN_SHOP_ID: cmutyz91b00006v2jtr5l1qiy
        run: |
          node <<'NODE'
          const base = process.env.APP_URL.replace(/\/$/, '');
          async function json(path, expectedStatus = 200) {
            const response = await fetch(base + path, { headers: { accept: 'application/json' } });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(path + ' did not return JSON (HTTP ' + response.status + ')'); }
            if (response.status !== expectedStatus) {
              throw new Error(path + ' expected HTTP ' + expectedStatus + ', got ' + response.status + ': ' + JSON.stringify(body).slice(0, 250));
            }
            return body;
          }

          (async () => {
            const health = await json('/api/health');
            if (health.ok !== true || health.app !== 'up' || health.database !== 'up') {
              throw new Error('Live health check did not report app and database up');
            }

            const me = await json('/api/auth/me');
            if (me.user !== null) throw new Error('Anonymous /api/auth/me unexpectedly returned a user');

            await json('/api/my/listings', 401);
            await json('/api/settings/postgres', 401);
            // Aggregate analytics are private too: no session must never see counts.
            await json('/api/admin/analytics', 401);

            // A 403 means the endpoint is configured and rejected our invalid
            // secret. A 503 would mean CRON_SECRET is missing in production.
            const cronGuard = await fetch(base + '/api/cron/sweep', {
              method: 'POST',
              headers: { 'x-cron-secret': 'mudaala-live-check-invalid-secret', accept: 'application/json' },
            });
            if (cronGuard.status !== 403) {
              const detail = (await cronGuard.text()).slice(0, 200);
              throw new Error('Cron sweep should reject an invalid secret with HTTP 403; got ' + cronGuard.status + ': ' + detail);
            }

            const search = await json('/api/listings?page=1&pageSize=10');
            if (!Array.isArray(search.items)) throw new Error('Public listing search response is missing items[]');

            // Exercise the public search paths after every production deploy.
            // Do not require a specific product to exist in production data.
            const perfumeSearch = await json('/api/listings?q=perfume&page=1&pageSize=10');
            const budgetSearch = await json('/api/listings?q=perfume%20under%2030k&page=1&pageSize=10');
            const cheapSearch = await json('/api/listings?q=cheap%20perfume&page=1&pageSize=10');
            for (const [label, result] of [['perfume', perfumeSearch], ['budget', budgetSearch], ['cheap', cheapSearch]]) {
              if (!Array.isArray(result.items)) throw new Error('Public ' + label + ' search response is missing items[]');
            }
            const shopNameSearch = await json('/api/shops/search?q=Mudaala');
            if (!Array.isArray(shopNameSearch.shops)) throw new Error('Public shop-name search response is missing shops[]');

            const listing = search.items.find(item => Array.isArray(item.photos) && item.photos.length > 0);
            if (!listing) throw new Error('No active listing with photos is available for live media verification');

            const detailBody = await json('/api/listings/' + encodeURIComponent(listing.id));
            const detail = detailBody.listing;
            if (!detail || !Array.isArray(detail.photos)) throw new Error('Public listing detail response is malformed');
            if (detail.status !== 'ACTIVE') throw new Error('Public search returned a listing that is not ACTIVE');

            const owner = detail.user || {};
            for (const field of ['phone', 'email', 'password', 'passwordHash', 'isAdmin', 'legalAcceptedAt', 'role']) {
              if (Object.prototype.hasOwnProperty.call(owner, field)) {
                throw new Error('Public listing detail leaked private owner field: ' + field);
              }
            }
            const profile = owner.profile || {};
            for (const field of ['phone', 'whatsapp', 'userId', 'verified']) {
              if (Object.prototype.hasOwnProperty.call(profile, field)) {
                throw new Error('Public listing detail leaked private profile field: ' + field);
              }
            }

            const shopBody = await json('/api/shops/' + encodeURIComponent(detail.userId));
            if (!shopBody.shop || typeof shopBody.shop.isAdmin !== 'boolean') {
              throw new Error('Public shop response is missing the server-derived isAdmin boolean');
            }

            // This is the account whose missing admin badge is being investigated.
            const adminShop = await json('/api/shops/' + encodeURIComponent(process.env.EXPECTED_ADMIN_SHOP_ID));
            if (!adminShop.shop || adminShop.shop.isAdmin !== true) {
              throw new Error('The expected administrator shop is not receiving isAdmin=true from the live API');
            }

            // The older public seller route must preserve its storefront shape
            // without serializing internal profile ownership/verification fields.
            const legacySeller = await json('/api/sellers/' + encodeURIComponent(process.env.EXPECTED_ADMIN_SHOP_ID));
            const legacyProfile = legacySeller.profile;
            if (!legacyProfile || ['id', 'userId', 'verified', 'isSeed', 'createdAt', 'updatedAt'].some(field =>
              Object.prototype.hasOwnProperty.call(legacyProfile, field))) {
              throw new Error('Legacy public seller endpoint exposed internal profile metadata');
            }

            // A cover-photo value in the public shop response is read from the
            // persisted profile row. Fetch the object too, so a stale/broken URL
            // cannot pass as a successful photo-save round trip.
            const coverPhotoUrl = adminShop.shop.coverPhotoUrl;
            if (typeof coverPhotoUrl !== 'string' || coverPhotoUrl.length === 0) {
              throw new Error('The production administrator shop has no persisted coverPhotoUrl');
            }
            const coverUrl = new URL(coverPhotoUrl, base);
            if (coverUrl.protocol !== 'https:') throw new Error('Cover-photo URL is not HTTPS');
            const coverResponse = await fetch(coverUrl);
            const coverType = coverResponse.headers.get('content-type') || '';
            if (!coverResponse.ok || !coverType.toLowerCase().startsWith('image/')) {
              throw new Error('Persisted cover photo could not be served: HTTP ' + coverResponse.status + ', content-type=' + coverType);
            }

            const imageUrls = [...new Set([
              detail.photos[0],
              shopBody.shop.photoUrl,
            ].filter(Boolean))].slice(0, 2);
            let imagesVerified = 0;
            for (const rawUrl of imageUrls) {
              const url = new URL(rawUrl, base);
              if (url.protocol !== 'https:') throw new Error('Photo URL is not HTTPS');
              const response = await fetch(url, { method: 'GET' });
              const contentType = response.headers.get('content-type') || '';
              if (!response.ok || !contentType.toLowerCase().startsWith('image/')) {
                throw new Error('Photo delivery failed: HTTP ' + response.status + ', content-type=' + contentType + ', host=' + url.host);
              }
              imagesVerified++;
            }

            console.log(JSON.stringify({
              health: 'pass',
              anonymousAuth: 'pass',
              protectedRoutes: '401 as expected',
              publicListingDetail: 'pass',
              productSearch: { perfume: perfumeSearch.items.length, budget: budgetSearch.items.length, cheap: cheapSearch.items.length },
              shopNameSearch: shopNameSearch.shops.length + ' results returned',
              privateOwnerFields: 'not exposed',
              publicShopAdminFlag: 'boolean present',
              targetAdminBadge: 'isAdmin=true',
              coverPhotoPersistence: 'persisted and publicly served',
              publicImages: imagesVerified + ' verified',
            }, null, 2));
          })().catch(error => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE

      - name: Verify production owner/admin boundaries and photo persistence with disposable accounts
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        env:
          APP_URL: https://mudaala-cloudflare.kaisoisaac.workers.dev
        run: |
          node <<'NODE'
          const base = process.env.APP_URL.replace(/\/$/, '');
          const png = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jZr8AAAAASUVORK5CYII=', 'base64');
          const passwordFor = () => 'Q7!' + Math.random().toString(36).slice(2, 14) + 'zR';
          const phoneFor = () => '+2567' + String(Math.floor(10000000 + Math.random() * 89999999));
          const owner = { phone: phoneFor(), password: passwordFor(), cookie: null };
          const stranger = { phone: phoneFor(), password: passwordFor(), cookie: null };
          const auditTag = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          let listingId = null;
          let cleanupFailed = false;

          async function api(path, options = {}) {
            const method = options.method || 'GET';
            const headers = { accept: 'application/json' };
            if (options.cookie) headers.cookie = options.cookie;
            if (method !== 'GET' && method !== 'HEAD') {
              headers.origin = base;
              headers.referer = base + '/';
            }
            let body;
            if (options.form) {
              body = options.form;
            } else if (options.body !== undefined) {
              headers['content-type'] = 'application/json';
              body = JSON.stringify(options.body);
            }
            const response = await fetch(base + path, { method, headers, body });
            const raw = await response.text();
            let json = null;
            try { json = JSON.parse(raw); } catch {}
            return { status: response.status, json, raw, headers: response.headers };
          }

          async function register(account, name) {
            const result = await api('/api/auth/register', {
              method: 'POST',
              body: {
                phone: account.phone,
                name,
                password: account.password,
                country: 'UG',
                acceptTerms: true,
              },
            });
            if (result.status !== 201) throw new Error('Disposable account registration failed with HTTP ' + result.status);
            const setCookie = result.headers.get('set-cookie');
            account.cookie = setCookie ? setCookie.split(';')[0] : null;
            if (!account.cookie) throw new Error('Registration did not issue the expected session cookie');
          }

          async function cleanup(account, label) {
            if (!account.cookie) return;
            for (let attempt = 0; attempt < 2; attempt++) {
              const result = await api('/api/account', {
                method: 'DELETE',
                cookie: account.cookie,
                body: { password: account.password },
              }).catch(() => null);
              if (result && result.status === 200 && result.json?.deleted === true) return;
            }
            cleanupFailed = true;
            console.error('Could not clean up disposable audit account:', label);
          }

          (async () => {
            try {
              await register(owner, 'Mudaala Audit Owner');
              await register(stranger, 'Mudaala Audit Stranger');

              const adminAnon = await api('/api/admin/analytics');
              if (adminAnon.status !== 401) throw new Error('Anonymous admin analytics should be 401; got ' + adminAnon.status);
              const adminUser = await api('/api/admin/analytics', { cookie: owner.cookie });
              if (adminUser.status !== 403) throw new Error('Ordinary user admin analytics should be 403; got ' + adminUser.status);
              const reportsUser = await api('/api/admin/reports', { cookie: owner.cookie });
              if (reportsUser.status !== 403) throw new Error('Ordinary user admin reports should be 403; got ' + reportsUser.status);

              const form = new FormData();
              form.append('file', new Blob([png], { type: 'image/png' }), 'audit-photo.png');
              const uploaded = await api('/api/upload', { method: 'POST', cookie: owner.cookie, form });
              if (uploaded.status !== 201 || typeof uploaded.json?.url !== 'string' || !uploaded.json.url.startsWith('https://')) {
                throw new Error('Authenticated production photo upload failed with HTTP ' + uploaded.status);
              }
              const photoUrl = uploaded.json.url;
              const title = 'Temporary Mudaala security audit ' + auditTag;
              const created = await api('/api/listings', {
                method: 'POST',
                cookie: owner.cookie,
                body: {
                  type: 'OFFER',
                  title,
                  description: 'Temporary listing created only for automated permission and photo-persistence verification.',
                  category: 'electronics',
                  price: 500,
                  currency: 'UGX',
                  priceNegotiable: false,
                  unit: 'piece',
                  quantity: 1,
                  country: 'UG',
                  county: 'Kampala',
                  area: 'Automated audit',
                  contactPhone: owner.phone,
                  contactWhatsapp: null,
                  photos: [photoUrl],
                },
              });
              if (created.status !== 201 || !created.json?.listing?.id) {
                throw new Error('Disposable listing creation failed with HTTP ' + created.status);
              }
              listingId = created.json.listing.id;

              const strangerEdit = await api('/api/listings/' + encodeURIComponent(listingId), {
                method: 'PATCH', cookie: stranger.cookie, body: { title: 'Unauthorized change' },
              });
              if (strangerEdit.status !== 404) throw new Error('Non-owner edit should be denied with 404; got ' + strangerEdit.status);
              const strangerDelete = await api('/api/listings/' + encodeURIComponent(listingId), {
                method: 'DELETE', cookie: stranger.cookie,
              });
              if (strangerDelete.status !== 404) throw new Error('Non-owner delete should be denied with 404; got ' + strangerDelete.status);

              const editedTitle = title + ' verified';
              const ownerEdit = await api('/api/listings/' + encodeURIComponent(listingId), {
                method: 'PATCH', cookie: owner.cookie, body: { title: editedTitle },
              });
              if (ownerEdit.status !== 200) throw new Error('Owner edit should succeed; got HTTP ' + ownerEdit.status);

              const persisted = await api('/api/listings/' + encodeURIComponent(listingId));
              if (persisted.status !== 200 || persisted.json?.listing?.title !== editedTitle ||
                  !Array.isArray(persisted.json?.listing?.photos) || !persisted.json.listing.photos.includes(photoUrl)) {
                throw new Error('Listing edit/photo URL did not persist across a fresh production read');
              }
              const imageResponse = await fetch(photoUrl);
              if (!imageResponse.ok || !(imageResponse.headers.get('content-type') || '').toLowerCase().startsWith('image/')) {
                throw new Error('Uploaded production photo was not publicly retrievable after save/re-read');
              }

              console.log(JSON.stringify({
                productionOwnerBoundary: 'pass (non-owner edit/delete denied; owner edit allowed)',
                adminBoundary: 'pass (anonymous 401; ordinary user 403)',
                photoPersistence: 'pass (authenticated upload -> listing save -> fresh read -> image fetch)',
                cleanup: 'disposable accounts will be removed in finally',
              }, null, 2));
            } finally {
              // Account deletion cascades the temporary listing and deletes its
              // owned photo from storage. These are generated accounts only.
              await cleanup(owner, 'owner');
              await cleanup(stranger, 'stranger');
              if (cleanupFailed) throw new Error('A disposable audit account could not be deleted; investigate before repeating the live verifier');
            }
          })().catch(error => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE

      - name: Install Playwright Chromium for real-browser verification
        run: |
          npm install --prefix /tmp/mudaala-browser-test playwright@1.56.1
          /tmp/mudaala-browser-test/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify photo elements render in a real browser
        env:
          APP_URL: https://mudaala-cloudflare.kaisoisaac.workers.dev
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/mudaala-browser-test/node_modules/playwright');
          const base = process.env.APP_URL.replace(/\/$/, '');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
              const failedRequests = [];
              page.on('requestfailed', request => {
                if (request.url().includes('/storage/v1/object/public/')) {
                  failedRequests.push({ host: new URL(request.url()).host, failure: request.failure()?.errorText ?? 'request failed' });
                }
              });

              // The root view is a dashboard/browse shell and is not a stable
              // assertion target for media. Select an actual public listing
              // with photos through the same API contract tested above, then
              // exercise the user-facing detail view that must render them.
              const listingResponse = await fetch(base + '/api/listings?page=1&pageSize=10', {
                headers: { accept: 'application/json' },
              });
              if (!listingResponse.ok) throw new Error('Could not load public listings for browser media verification: HTTP ' + listingResponse.status);
              const listingPayload = await listingResponse.json();
              const listing = Array.isArray(listingPayload.items)
                ? listingPayload.items.find(item => Array.isArray(item.photos) && item.photos.length > 0)
                : null;
              if (!listing) throw new Error('No public listing with photos is available for browser media verification');

              await page.goto(base + '/#/listing/' + encodeURIComponent(listing.id), {
                waitUntil: 'domcontentloaded',
                timeout: 60000,
              });
              await page.waitForFunction(
                () => [...document.images].some(img => img.src.includes('/storage/v1/object/public/')),
                null,
                { timeout: 20000 },
              );
              await page.locator('img[src*="/storage/v1/object/public/"]').evaluateAll(images => {
                for (const img of images) img.loading = 'eager';
              });
              await page.waitForFunction(
                () => {
                  const images = [...document.images].filter(img => img.src.includes('/storage/v1/object/public/'));
                  return images.length > 0 && images.every(img => img.complete);
                },
                null,
                { timeout: 30000 },
              );

              const images = await page.locator('img[src*="/storage/v1/object/public/"]').evaluateAll(elements =>
                elements.map(img => ({ complete: img.complete, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight })),
              );
              const broken = images.filter(img => img.naturalWidth === 0 || img.naturalHeight === 0);
              if (failedRequests.length || broken.length) {
                throw new Error('Browser photo rendering failed: ' + JSON.stringify({ images, failedRequests }));
              }
              console.log(JSON.stringify({ browser: 'pass', renderedStoragePhotos: images.length, images }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
      - name: Verify mobile Post navigation reaches the publish flow
        env:
          APP_URL: https://mudaala-cloudflare.kaisoisaac.workers.dev
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/mudaala-browser-test/node_modules/playwright');
          const base = process.env.APP_URL.replace(/\/$/, '');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({
                viewport: { width: 390, height: 844 },
                isMobile: true,
                hasTouch: true,
              });
              await page.goto(base + '/#/browse', {
                waitUntil: 'domcontentloaded',
                timeout: 60000,
              });

              const offerResponse = await fetch(base + '/api/listings?type=OFFER&page=1&pageSize=10');
              if (!offerResponse.ok) throw new Error('Could not load public offers for mobile cart-overlay verification');
              const offerPayload = await offerResponse.json();
              const offer = Array.isArray(offerPayload.items)
                ? offerPayload.items.find(item => item.type === 'OFFER')
                : null;
              if (!offer) throw new Error('No active offer is available for mobile cart-overlay verification');

              async function tapMobile(locator) {
                await locator.waitFor({ state: 'visible', timeout: 15000 });
                await page.waitForTimeout(250);
                const point = await locator.evaluate(el => {
                  const rect = el.getBoundingClientRect();
                  const viewport = window.visualViewport;
                  const scale = viewport?.scale ?? 1;
                  const offsetLeft = viewport?.offsetLeft ?? 0;
                  const offsetTop = viewport?.offsetTop ?? 0;
                  return {
                    x: (rect.left + rect.width / 2 - offsetLeft) / scale,
                    y: (rect.top + rect.height / 2 - offsetTop) / scale,
                  };
                });
                await page.touchscreen.tap(point.x, point.y);
              }

              await page.goto(base + '/#/listing/' + encodeURIComponent(offer.id), {
                waitUntil: 'domcontentloaded',
                timeout: 60000,
              });
              await page.getByRole('button', { name: 'Add to cart' }).click();
              const cartBar = page.locator('button[aria-controls="cart-mobile-sheet"]');
              await cartBar.waitFor({ state: 'visible', timeout: 15000 });
              const hitTest = await cartBar.evaluate(el => {
                const rect = el.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;
                const top = document.elementFromPoint(x, y);
                const layer = el.closest('div[style*="2147483647"]');
                const style = getComputedStyle(el);
                const layerStyle = layer ? getComputedStyle(layer) : null;
                return {
                  rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height },
                  viewport: { innerWidth: window.innerWidth, innerHeight: window.innerHeight, clientWidth: document.documentElement.clientWidth, clientHeight: document.documentElement.clientHeight, scrollY: window.scrollY },
                  visualViewport: window.visualViewport ? { width: window.visualViewport.width, height: window.visualViewport.height, scale: window.visualViewport.scale, offsetLeft: window.visualViewport.offsetLeft, offsetTop: window.visualViewport.offsetTop } : null,
                  viewportMeta: document.querySelector('meta[name="viewport"]')?.getAttribute('content') ?? null,
                  buttonStyle: { position: style.position, zIndex: style.zIndex, pointerEvents: style.pointerEvents, left: style.left, right: style.right, bottom: style.bottom, width: style.width, transform: style.transform },
                  layerStyle: layerStyle ? { position: layerStyle.position, zIndex: layerStyle.zIndex, pointerEvents: layerStyle.pointerEvents, width: layerStyle.width, height: layerStyle.height } : null,
                  hitTarget: top ? { tag: top.tagName, id: top.id, className: typeof top.className === 'string' ? top.className : '', isCartButton: top === el, insideCartButton: el.contains(top) } : null,
                };
              });
              console.log('Mobile cart hit-test diagnostics:', JSON.stringify(hitTest));
              await tapMobile(cartBar);
              const cartSheet = page.locator('#cart-mobile-sheet');
              await cartSheet.waitFor({ state: 'visible', timeout: 10000 });
              await tapMobile(cartSheet.getByRole('button', { name: 'Close the cart' }));
              await cartSheet.waitFor({ state: 'hidden', timeout: 10000 });

              const primary = page.getByRole('navigation', { name: 'Primary' });
              const post = primary.getByRole('button', { name: 'Post' });
              await post.waitFor({ state: 'visible', timeout: 20000 });
              await tapMobile(post);

              await page.waitForFunction(() => window.location.hash === '#/publish', null, { timeout: 10000 });
              await page.getByRole('heading', { name: 'Sign in to post an ad' }).waitFor({ timeout: 15000 });

              console.log(JSON.stringify({
                mobileViewport: '390x844',
                cartOverlay: 'opened and closed cleanly',
                postAction: 'visible and tappable after overlay dismissal',
                destination: await page.evaluate(() => window.location.hash),
                signedOutGuard: 'publish view shown without creating data',
                explicitMutationRequests: 0,
              }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
