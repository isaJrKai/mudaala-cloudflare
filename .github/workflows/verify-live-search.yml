name: Verify live shop and product search semantics

on:
  pull_request:
    paths:
      - '.github/workflows/verify-live-search.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Mudaala to Cloudflare Workers"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-search:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify live search API contracts without assuming seller inventory
        env:
          APP_URL: https://mudaala.store
        run: |
          node <<'NODE'
          const base = process.env.APP_URL.endsWith('/') ? process.env.APP_URL.slice(0, -1) : process.env.APP_URL;

          async function getJson(path) {
            const response = await fetch(base + path, {
              headers: { accept: 'application/json' },
            });
            const raw = await response.text();
            let body;
            try {
              body = JSON.parse(raw);
            } catch {
              throw new Error(path + ' returned non-JSON (HTTP ' + response.status + ')');
            }
            if (!response.ok) {
              throw new Error(path + ' returned HTTP ' + response.status);
            }
            return body;
          }

          async function search(query) {
            const params = new URLSearchParams({ q: query, page: '1', pageSize: '50' });
            const body = await getJson('/api/listings?' + params);
            if (!Array.isArray(body.items)) {
              throw new Error('Search "' + query + '" did not return items[]');
            }
            return body.items;
          }

          function assertPublicShopShape(shop) {
            const allowed = new Set(['id', 'name', 'photoUrl', 'area', 'county', 'country']);
            if (!shop || typeof shop.id !== 'string' || typeof shop.name !== 'string') {
              throw new Error('Shop search returned an invalid public shop result');
            }
            if (Object.keys(shop).some(key => !allowed.has(key))) {
              throw new Error('Shop search exposed an unexpected or private field');
            }
          }

          (async () => {
            const health = await getJson('/api/health');
            if (health.ok !== true || health.app !== 'up' || health.database !== 'up') {
              throw new Error('Production health did not report app and database up');
            }

            // Search queries must return the documented response shape. Empty
            // results are valid: production inventory is owned by sellers and
            // must never be fabricated or required by a smoke test.
            const queries = ['', 'perfume', 'perfume under 30k', 'cheap perfume'];
            const searchResults = {};
            let browseItems = [];
            for (const query of queries) {
              const items = await search(query);
              if (query === '') browseItems = items;
              searchResults[query || '<browse>'] = items.length;
              for (const item of items) {
                if (!item || typeof item.id !== 'string' || typeof item.title !== 'string') {
                  throw new Error('Search "' + query + '" returned a malformed listing');
                }
              }
            }

            // Check the shop-name search response and privacy boundary. Use
            // a stable query but do not require any particular shop to exist.
            const shopSearch = await getJson('/api/shops/search?q=gras');
            if (!Array.isArray(shopSearch.shops)) {
              throw new Error('Shop-name search did not return shops[]');
            }

            let shopCodeLookup = 'not exercised: no matching live shop';
            let collections = 'not exercised: no matching live shop';
            if (shopSearch.shops.length > 0) {
              const shop = shopSearch.shops[0];
              assertPublicShopShape(shop);

              const page = await getJson('/api/shops/' + encodeURIComponent(shop.id));
              const code = page.shop?.shopCode;
              if (typeof code !== 'string' || !code) {
                throw new Error('Matched public shop has no shop code');
              }
              const lookup = await getJson('/api/shops/lookup?code=' + encodeURIComponent(code));
              if (lookup.shop?.id !== shop.id) {
                throw new Error('Shop-code lookup did not resolve to the same shop');
              }
              shopCodeLookup = 'verified';

              const payload = await getJson('/api/shops/' + encodeURIComponent(shop.id) + '/collections');
              if (!Array.isArray(payload.collections)) {
                throw new Error('Public shop collections response is missing collections[]');
              }
              const allowed = new Set(['id', 'title', 'description', 'coverPhotoUrl', 'sortOrder', 'itemCount']);
              for (const collection of payload.collections) {
                if (typeof collection.id !== 'string' || typeof collection.title !== 'string' ||
                    !Number.isInteger(collection.itemCount) || collection.itemCount < 0) {
                  throw new Error('Public collections response contains an invalid summary');
                }
                if (Object.keys(collection).some(key => !allowed.has(key))) {
                  throw new Error('Public collections response exposed an unexpected field');
                }
              }
              collections = 'verified (' + payload.collections.length + ')';
            }

            const offer = browseItems.find(item => item.type === 'OFFER' && typeof item.id === 'string') || null;
            let recommendations = 'not exercised: no active offer';
            if (offer) {
              const result = await getJson('/api/listings/' + encodeURIComponent(offer.id) + '/recommendations');
              if (!Array.isArray(result.items)) {
                throw new Error('Recommendations endpoint did not return items[]');
              }
              const privateFields = ['userId', 'phone', 'whatsapp', 'email', 'password', 'isAdmin'];
              for (const item of result.items) {
                if (!item || typeof item.id !== 'string' || typeof item.title !== 'string' ||
                    privateFields.some(field => Object.prototype.hasOwnProperty.call(item, field))) {
                  throw new Error('Recommendations returned malformed data or private fields');
                }
              }
              recommendations = 'verified (' + result.items.length + ')';
            }

            console.log(JSON.stringify({
              productionHealth: 'pass',
              listingSearchContracts: searchResults,
              shopNameSearch: {
                results: shopSearch.shops.length,
                privacy: shopSearch.shops.length ? 'verified' : 'not exercised: no matching shop',
              },
              shopCodeLookup,
              collections,
              recommendations,
              productionWrites: 0,
            }, null, 2));
          })().catch(error => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
