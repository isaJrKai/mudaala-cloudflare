name: Verify live shop and product search semantics

on:
  workflow_dispatch:
  # Verify the existing production deployment when this guard is first added.
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-search.yml'
  # Re-run the read-only semantic checks after future successful deployments.
  workflow_run:
    workflows: ["Deploy Mudaala to Cloudflare Workers"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-search:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live health and customer-facing search results
        env:
          APP_URL: https://mudaala-cloudflare.kaisoisaac.workers.dev
        run: |
          node <<'NODE'
          const base = process.env.APP_URL.replace(/\/$/, '');

          async function getJson(path) {
            const response = await fetch(base + path, {
              headers: { accept: 'application/json' },
            });
            const raw = await response.text();
            let body;
            try {
              body = JSON.parse(raw);
            } catch {
              throw new Error(path + ' returned non-JSON (HTTP ' + response.status + ')');
            }
            if (!response.ok) {
              throw new Error(path + ' returned HTTP ' + response.status);
            }
            return body;
          }

          function normalize(value) {
            return String(value ?? '')
              .normalize('NFKD')
              .replace(/[\u0300-\u036f]/g, '')
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, ' ')
              .trim()
              .replace(/\s+/g, ' ');
          }

          const productPattern = /\b(?:oil )?perfumes?\b|\bfragrances?\b|\bcolognes?\b|\bcolones?\b|\bbody sprays?\b|\baftershaves?\b|\bscents?\b|\boudh?\b/;

          function isRelevant(item) {
            const text = normalize([
              item.title,
              item.description,
              item.category,
            ].filter(Boolean).join(' '));
            return productPattern.test(text);
          }

          async function search(query) {
            const path = '/api/listings?' + new URLSearchParams({
              q: query,
              page: '1',
              pageSize: '50',
            });
            const body = await getJson(path);
            if (!Array.isArray(body.items)) {
              throw new Error('Search "' + query + '" did not return items[]');
            }
            return body.items;
          }

          (async () => {
            const health = await getJson('/api/health');
            if (health.ok !== true || health.app !== 'up' || health.database !== 'up') {
              throw new Error('Production health did not report app and database up');
            }

            // Verify the shop-name search path independently from product search.
            // "Gras" is a known prefix from a live seller listing; do not print
            // names, phone numbers, or other seller data into CI logs.
            const shopSearch = await getJson('/api/shops/search?q=gras');
            if (!Array.isArray(shopSearch.shops) || shopSearch.shops.length === 0) {
              throw new Error('Shop-name search did not find the known live seller prefix "gras"');
            }
            const safeShopFields = new Set(['id', 'name', 'photoUrl', 'area', 'county', 'country']);
            const shop = shopSearch.shops[0];
            if (!shop || typeof shop.id !== 'string' || typeof shop.name !== 'string') {
              throw new Error('Shop-name search returned an invalid public shop result');
            }
            if (Object.keys(shop).some((key) => !safeShopFields.has(key))) {
              throw new Error('Shop-name search returned an unexpected field; public search must not expose private contact/account data');
            }

            const shopPage = await getJson('/api/shops/' + encodeURIComponent(shop.id));
            const code = shopPage.shop?.shopCode;
            if (typeof code !== 'string' || !code) {
              throw new Error('The matched live shop has no public shop code for lookup verification');
            }
            const codeLookup = await getJson('/api/shops/lookup?code=' + encodeURIComponent(code));
            if (codeLookup.shop?.id !== shop.id) {
              throw new Error('Shop-code lookup did not resolve to the same shop returned by shop-name search');
            }

            // Read-only smoke for the newly deployed public collection routes.
            // Use the known live shop above; do not create or mutate production data.
            const shopCollectionsPayload = await getJson('/api/shops/' + encodeURIComponent(shop.id) + '/collections');
            if (!Array.isArray(shopCollectionsPayload.collections)) {
              throw new Error('Public shop collections response is missing collections[]');
            }
            const safeCollectionFields = new Set(['id', 'title', 'description', 'coverPhotoUrl', 'sortOrder', 'itemCount']);
            for (const collection of shopCollectionsPayload.collections) {
              if (typeof collection.id !== 'string' || typeof collection.title !== 'string' ||
                  !Number.isInteger(collection.itemCount) || collection.itemCount < 0) {
                throw new Error('Public shop collections response contains an invalid collection summary');
              }
              if (Object.keys(collection).some((key) => !safeCollectionFields.has(key))) {
                throw new Error('Public shop collections response exposes an unexpected field');
              }
            }
            const populatedCollection = shopCollectionsPayload.collections.find((collection) => collection.itemCount > 0);
            let collectionDetail = 'no populated live collection available';
            if (populatedCollection) {
              const detailPayload = await getJson('/api/collections/' + encodeURIComponent(populatedCollection.id));
              if (detailPayload.collection?.id !== populatedCollection.id || !Array.isArray(detailPayload.items)) {
                throw new Error('Public collection detail response is malformed');
              }
              if (Object.prototype.hasOwnProperty.call(detailPayload.collection, 'userId')) {
                throw new Error('Public collection detail leaked its owner user ID');
              }
              for (const item of detailPayload.items) {
                if (item.listing?.status !== 'ACTIVE' || item.listing?.type !== 'OFFER') {
                  throw new Error('Public collection detail exposed a non-active or non-offer listing');
                }
              }
              collectionDetail = 'verified';
            }
            console.log(JSON.stringify({
              publicCollections: 'ok',
              collectionCount: shopCollectionsPayload.collections.length,
              populatedCollectionDetail: collectionDetail,
            }));

            // The live catalogue has previously contained active perfume listings
            // with mathematical-bold Unicode text and category "other". Normalize
            // the returned seller text before checking relevance; never mutate data.
            const perfume = await search('perfume');
            const perfumeMatches = perfume.filter(isRelevant);
            if (perfumeMatches.length === 0) {
              throw new Error('Search "perfume" returned no semantically relevant listings in the first 50 results');
            }

            const budget = await search('perfume under 30k');
            const budgetMatches = budget.filter((item) =>
              isRelevant(item) &&
              item.price !== null &&
              item.price !== undefined &&
              Number.isFinite(Number(item.price)) &&
              Number(item.price) <= 30000
            );
            if (budgetMatches.length === 0) {
              throw new Error('Search "perfume under 30k" returned no relevant priced listing within UGX 30,000');
            }

            const cheap = await search('cheap perfume');
            const cheapMatches = cheap.filter(isRelevant);
            if (cheapMatches.length === 0) {
              throw new Error('Search "cheap perfume" returned no semantically relevant listings');
            }

            console.log(JSON.stringify({
              productionHealth: 'pass',
              shopNameSearch: { results: shopSearch.shops.length, privateFieldsExcluded: true },
              shopCodeLookup: { resolvedSameShop: true },
              perfume: { results: perfume.length, relevant: perfumeMatches.length },
              budget: { results: budget.length, relevantWithinBudget: budgetMatches.length },
              cheap: { results: cheap.length, relevant: cheapMatches.length },
              writesPerformed: 0,
              sellerTextOrListingsModified: false,
            }, null, 2));
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE
