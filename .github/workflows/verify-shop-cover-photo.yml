name: Verify shop cover photo changes

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "src/lib/validation.ts"
      - "src/lib/client.ts"
      - "src/lib/shop.ts"
      - "src/components/commerce/account-view.tsx"
      - "src/components/commerce/photo-picker.tsx"
      - "src/components/commerce/shop-view.tsx"
      - ".github/workflows/verify-shop-cover-photo.yml"
  push:
    branches: [feat/separate-shop-cover-photo]
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "src/lib/validation.ts"
      - "src/lib/client.ts"
      - "src/lib/shop.ts"
      - "src/components/commerce/account-view.tsx"
      - "src/components/commerce/photo-picker.tsx"
      - "src/components/commerce/shop-view.tsx"
      - ".github/workflows/verify-shop-cover-photo.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema and generate client without production DB access
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint changed shop-photo files
        run: npx eslint src/lib/validation.ts src/lib/client.ts src/lib/shop.ts src/components/commerce/account-view.tsx src/components/commerce/photo-picker.tsx src/components/commerce/shop-view.tsx

      - name: Build Cloudflare Worker bundle without production credentials or migrations
        run: npx @opennextjs/cloudflare build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          CRON_SECRET: build-only-placeholder
          SETTINGS_ENCRYPTION_KEY: build-only-placeholder-key-32chars
          ADMIN_PHONES: "+256700000000"
