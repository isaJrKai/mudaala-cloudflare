name: Temporary Next.js security dependency update

on:
  push:
    branches:
      - security/next-critical-upgrade
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: next-critical-upgrade
  cancel-in-progress: false

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          ref: security/next-critical-upgrade
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade patched Next.js and matching ESLint config
        run: npm install --save-exact --ignore-scripts next@16.4.3 eslint-config-next@16.4.3

      - name: Commit regenerated dependency lockfile
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix(security): upgrade patched Next.js dependencies"
            git push origin HEAD:security/next-critical-upgrade
          else
            echo "Dependency files already match the requested patched versions."
          fi

      - name: Verify clean install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Content policy tests
        run: npm run test:content-policy

      - name: Production build
        run: npm run build
