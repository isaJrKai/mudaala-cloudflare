name: API ownership, session isolation, and security suite

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/**"
      - "src/lib/auth.ts"
      - "src/lib/admin.ts"
      - "src/lib/storage.ts"
      - "src/lib/listings.ts"
      - "src/lib/api.ts"
      - "src/lib/shop.ts"
      - "scripts/test-api.ts"
      - "scripts/seed.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - ".github/workflows/verify-api-suite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mudaala
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mudaala"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala?schema=public
      CRON_SECRET: local-suite-cron-secret
      SETTINGS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      ADMIN_PHONES: "+256712000001"
      NEXT_PUBLIC_APP_URL: https://mudaala-suite.example
      SMS_PROVIDER: console
      NODE_ENV: production
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate schema and generate Prisma client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Create a fresh disposable test database
        run: npx prisma db push

      - name: Seed only the disposable test database
        run: npx tsx scripts/seed.ts

      - name: Build production app
        run: npm run build

      - name: Start production server
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/mudaala-suite.log 2>&1 &
          echo $! > /tmp/mudaala-suite.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/mudaala-health.json; then
              cat /tmp/mudaala-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mudaala-suite.log
          exit 1

      - name: Run full API behavior and ownership suite
        run: npx tsx scripts/test-api.ts

      - name: Print server logs on failure
        if: failure()
        run: cat /tmp/mudaala-suite.log || true
