name: Register Telegram Merchant Assistant webhook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-telegram-webhook.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-webhook-registration
  cancel-in-progress: false

jobs:
  register:
    name: Register production Telegram webhook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Generate a Telegram-compatible webhook secret
        id: webhook-secret
        shell: bash
        run: |
          # 32 random bytes encoded as 64 lowercase hex characters.
          # The value is passed only through the masked GitHub step output.
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "value=$secret" >> "$GITHUB_OUTPUT"

      - name: Synchronize Worker webhook secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7d45a3db16c2ce332bf146d34eb01687
          TELEGRAM_WEBHOOK_SECRET: ${{ steps.webhook-secret.outputs.value }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$TELEGRAM_WEBHOOK_SECRET" ]; then
            echo "::error::Cloudflare API token or generated webhook secret is unavailable."
            exit 1
          fi
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --name mudaala-cloudflare

      - name: Register webhook with Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ steps.webhook-secret.outputs.value }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_WEBHOOK_SECRET" ]; then
            echo "::error::Telegram bot token or generated webhook secret is unavailable."
            exit 1
          fi
          node scripts/register-telegram-webhook.mjs
