name: Regenerate security lockfile (one-off)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-dependency-advisories
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from the updated manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify clean locked install and production audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Commit generated lockfile and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/regenerate-security-lock.yml
          git commit -m "chore: regenerate npm lockfile for security updates"
          git push origin HEAD:fix/production-dependency-advisories
          gh workflow run validate-pr.yml --ref fix/production-dependency-advisories
