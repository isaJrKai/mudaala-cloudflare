name: Verify photo and auth fixes

on:
  push:
    branches: [fix/photo-upload-password-visibility]
    paths:
      - "src/app/api/upload/route.ts"
      - "src/lib/storage.ts"
      - "src/components/commerce/auth-dialog.tsx"
      - ".github/workflows/verify-photo-auth-fix.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/upload/route.ts"
      - "src/lib/storage.ts"
      - "src/components/commerce/auth-dialog.tsx"
      - ".github/workflows/verify-photo-auth-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mudaala
      - name: Type-check project
        run: npx tsc --noEmit
      - name: Lint changed files
        run: npx eslint src/app/api/upload/route.ts src/lib/storage.ts src/components/commerce/auth-dialog.tsx
