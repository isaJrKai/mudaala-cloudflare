name: Verify photo and auth fixes

on:
  push:
    branches:
      - fix/photo-upload-password-visibility
      - fix/photo-upload-password-visibility-reconciled
    paths:
      - "wrangler.jsonc"
      - "next.config.ts"
      - "src/app/api/upload/route.ts"
      - "src/lib/storage.ts"
      - "src/components/commerce/auth-dialog.tsx"
      - ".github/workflows/verify-photo-auth-fix.yml"
  pull_request:
    branches: [main]
    paths:
      - "wrangler.jsonc"
      - "next.config.ts"
      - "src/app/api/upload/route.ts"
      - "src/lib/storage.ts"
      - "src/components/commerce/auth-dialog.tsx"
      - ".github/workflows/verify-photo-auth-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install OpenNext and PostgreSQL adapter tooling
        run: npm install --no-save --no-package-lock --include=dev @aws-sdk/client-s3 @opennextjs/cloudflare@1.20.8 @prisma/adapter-pg@6.19.3 pg@8.16.3

      - name: Validate schema and generate Prisma client
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala

      - name: Type-check project
        run: npx tsc --noEmit

      - name: Build Cloudflare Worker bundle without production credentials or migrations
        run: npx --yes @opennextjs/cloudflare@1.20.8 build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mudaala
          CRON_SECRET: build-only-placeholder
          SETTINGS_ENCRYPTION_KEY: build-only-placeholder-key-32chars
          ADMIN_PHONES: "+256700000000"

      - name: Lint changed files
        run: npx eslint next.config.ts src/app/api/upload/route.ts src/lib/storage.ts src/components/commerce/auth-dialog.tsx
